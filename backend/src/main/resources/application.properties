spring.application.name=services

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/electrical_services_db}
spring.datasource.username=postgres
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.jpa.open-in-view=false

# Security
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRY_MINUTES:480}
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.admin.name=${ADMIN_NAME:Administrator}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Uploads
app.upload.dir=${UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Hide internal error details from responses
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never

# Correct client IP and HTTPS detection behind a host's proxy
server.forward-headers-strategy=native